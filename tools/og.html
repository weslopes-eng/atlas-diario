<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:630px;font-family:ui-rounded,"Nunito",system-ui,sans-serif;background:linear-gradient(135deg,#5b21f0,#8b2cf5 40%,#ff3d7f 80%,#ff9a3d);color:#fff;overflow:hidden;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(50px);opacity:.6}
h1{font-size:110px;margin:0;line-height:1;text-shadow:0 6px 20px rgba(0,0,0,.25)} h1 b{color:#ffcc00}
.wrap{position:absolute;left:70px;top:80px;width:640px}
p{font-size:40px;font-weight:700;margin:22px 0}
.pill{display:inline-block;background:#fff;color:#6a2cf5;border-radius:999px;padding:12px 26px;font-size:30px;font-weight:800}
.grid{font-size:64px;letter-spacing:8px;margin-top:24px}
.card{position:absolute;right:70px;top:110px;width:400px;background:#fff;border-radius:36px;color:#1b1340;padding:26px;box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:center}
.vs{display:flex;justify-content:space-around;align-items:center;font-size:100px}
.vs span.v{font-size:30px;background:#1b1340;color:#ffcc00;border-radius:50%;width:64px;height:64px;display:grid;place-items:center;font-weight:900}
.q{font-size:34px;font-weight:900;margin-top:10px}
.n{display:flex;justify-content:space-around;font-weight:800;font-size:28px}
</style></head><body>
<div class="blob" style="width:400px;height:400px;background:#2ec5ff;left:-120px;top:-120px"></div>

</body></html>
